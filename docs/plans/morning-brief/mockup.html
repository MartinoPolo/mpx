<title>Morning Brief Mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400;700&display=swap">
<style>
/* Layout: the narrated-walkthrough shell. Chapter sidebar left, one slide per area on the stage, caption and two-row play controls at the bottom. */
:root {
	color-scheme: dark;
	--stage: #121314;
	--surface: #191a1b;
	--raised: #202122;
	--border: #2a2b2c;
	--text-primary: #ededed;
	--text-secondary: #bfbfbf;
	--text-muted: #8c8c8c;
	--accent: #48a0c7;
	--accent-strong: #297aa0;
	--on-accent: #ffffff;
	--added: #73c991;
	--modified: #e5ba7d;
	--removed: #f48771;
	--selection: rgba(255, 255, 255, 0.13);
	--selection-inactive: #2c2d2e;
	--hover: rgba(255, 255, 255, 0.04);
	--avatar-1: #3b6e8f;
	--avatar-2: #4f7a54;
	--avatar-3: #6b5b8a;
	--font-body: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
	--font-mono: 'JetBrains Mono', ui-monospace, 'Cascadia Code', Consolas, monospace;
}
@media (prefers-color-scheme: light) {
	:root:not([data-theme="dark"]) {
		color-scheme: light;
		--stage: #f6f8fa; --surface: #ffffff; --raised: #f3f4f6; --border: #dfe3e8;
		--text-primary: #111827; --text-secondary: #374151; --text-muted: #5b6472;
		--accent: #1f6f99; --accent-strong: #1f6f99; --on-accent: #ffffff;
		--added: #1a7f37; --modified: #8a5a00; --removed: #c4262e;
		--selection: rgba(31, 111, 153, 0.12); --selection-inactive: #e8edf2; --hover: rgba(17, 24, 39, 0.04);
		--avatar-1: #3b6e8f; --avatar-2: #3f6b45; --avatar-3: #5d4f7a;
	}
}
:root[data-theme="light"] {
	color-scheme: light;
	--stage: #f6f8fa; --surface: #ffffff; --raised: #f3f4f6; --border: #dfe3e8;
	--text-primary: #111827; --text-secondary: #374151; --text-muted: #5b6472;
	--accent: #1f6f99; --accent-strong: #1f6f99; --on-accent: #ffffff;
	--added: #1a7f37; --modified: #8a5a00; --removed: #c4262e;
	--selection: rgba(31, 111, 153, 0.12); --selection-inactive: #e8edf2; --hover: rgba(17, 24, 39, 0.04);
	--avatar-1: #3b6e8f; --avatar-2: #3f6b45; --avatar-3: #5d4f7a;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; overflow: hidden; background: var(--stage); color: var(--text-secondary); font: 400 14px/1.45 var(--font-body); }
button { font: inherit; color: inherit; cursor: pointer; }
a { color: var(--accent); text-decoration: none; font-weight: 600; }
a:hover { text-decoration: underline; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--font-mono); }

#app { display: grid; grid-template-columns: 280px minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) auto; height: 100%; }

/* Sidebar */
.sidebar { grid-row: 1 / 3; border-right: 1px solid var(--border); background: var(--surface); overflow-y: auto; padding: 18px 10px; display: flex; flex-direction: column; gap: 18px; }
.brief-title { padding: 0 10px; }
.brief-title h1 { margin: 0; font-size: 17px; font-weight: 700; color: var(--text-primary); }
.brief-title p { margin: 4px 0 0; font: 400 12px var(--font-mono); color: var(--text-muted); }
.section-heading { font-weight: 600; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-muted); margin: 0 0 6px 10px; }
.chapter-list { display: flex; flex-direction: column; gap: 2px; }
.chapter-row { display: flex; align-items: center; gap: 8px; width: 100%; border: 0; background: none; text-align: left; border-radius: 6px; padding: 6px 10px; font-weight: 600; color: var(--text-secondary); }
.chapter-row:hover { background: var(--hover); }
.chapter-row.current { background: var(--selection-inactive); color: var(--text-primary); }
.chapter-row .number { width: 18px; color: var(--text-muted); font: 400 12px var(--font-mono); flex: none; }
.chapter-row .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chapter-row.quiet { color: var(--text-muted); font-weight: 400; }
.status { flex: none; font: 600 11px var(--font-body); letter-spacing: 0.04em; padding: 1px 7px; border-radius: 999px; }
.status.needs { background: var(--accent-strong); color: var(--on-accent); }
.status.fyi { background: var(--selection); color: var(--text-secondary); }
.status.quiet { color: var(--text-muted); padding: 1px 0; }
.note-row { display: block; width: 100%; border: 0; background: none; text-align: left; padding: 4px 10px 4px 36px; border-radius: 6px; font-size: 13px; color: var(--text-muted); line-height: 1.35; }
.note-row:hover { background: var(--hover); }
.note-row.done { color: var(--text-secondary); }
.note-row.current { color: var(--text-primary); background: var(--selection); }
.legend { margin-top: auto; padding: 10px; font-size: 12px; color: var(--text-muted); display: flex; flex-direction: column; gap: 6px; border-top: 1px solid var(--border); }
.legend span { display: flex; gap: 8px; align-items: center; }

/* Main */
.main { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; min-width: 0; min-height: 0; }
.header { display: flex; align-items: flex-end; gap: 16px; padding: 18px 24px 12px; flex-wrap: wrap; }
.header .kicker { font-weight: 600; font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-muted); }
.header h2 { margin: 4px 0 0; font-size: 24px; font-weight: 700; color: var(--text-primary); text-wrap: balance; }
.header .spacer { flex: 1; }
.sample-chip { font: 600 11px var(--font-body); letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-muted); border: 1px dashed var(--border); border-radius: 999px; padding: 3px 10px; }
.stage { position: relative; overflow-y: auto; padding: 4px 24px 18px; min-height: 0; }
.caption { margin: 0 24px 10px; padding: 10px 14px; border-radius: 8px; background: var(--surface); border: 1px solid var(--border); color: var(--text-primary); font-size: 15px; min-height: 44px; display: flex; gap: 10px; align-items: baseline; }
.caption .speaker { font: 600 11px var(--font-body); letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); flex: none; }

/* Highlighting: narration lights its targets and dims their siblings. */
[data-target] { transition: opacity 0.3s, box-shadow 0.3s, border-color 0.3s, background 0.3s; }
.highlighting [data-target]:not(.highlighted) { opacity: 0.45; }
.highlighted { box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 35%, transparent); border-color: var(--accent) !important; }

/* Shared slide parts */
.panel { border: 1px solid var(--border); border-radius: 10px; background: var(--surface); }
.group-label { font: 600 12px var(--font-body); letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-muted); margin: 0 0 8px; }
.badge { display: inline-block; font: 600 11px var(--font-body); letter-spacing: 0.05em; text-transform: uppercase; padding: 2px 8px; border-radius: 999px; background: var(--selection); color: var(--text-secondary); white-space: nowrap; }
.badge.added { background: color-mix(in srgb, var(--added) 16%, transparent); color: var(--added); }
.badge.modified { background: color-mix(in srgb, var(--modified) 16%, transparent); color: var(--modified); }
.badge.removed { background: color-mix(in srgb, var(--removed) 16%, transparent); color: var(--removed); }
.badge.accent { background: color-mix(in srgb, var(--accent) 18%, transparent); color: var(--accent); }

/* Overview */
.overview { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 24px; align-items: start; }
.window-line { font: 400 13px var(--font-mono); color: var(--text-muted); margin: 0 0 16px; }
.need-list { display: flex; flex-direction: column; gap: 10px; margin: 0; padding: 0; list-style: none; }
.need { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 14px 16px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); }
.need .index { font: 700 15px var(--font-mono); color: var(--accent); }
.need .what { font-size: 16px; color: var(--text-primary); font-weight: 600; }
.need .where { font-size: 13px; color: var(--text-muted); }
.jump { border: 1px solid var(--border); background: none; border-radius: 8px; padding: 5px 11px; font-size: 12px; color: var(--text-secondary); }
.jump:hover { border-color: var(--accent); color: var(--text-primary); }
.area-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.area { display: flex; flex-direction: column; gap: 4px; padding: 12px 14px; text-align: left; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); }
.area:hover { border-color: var(--accent); }
.area .area-name { font-weight: 600; color: var(--text-primary); }
.area .area-fact { font-size: 13px; color: var(--text-muted); }
.area.quiet { background: transparent; border-style: dashed; }
.area.quiet .area-name { color: var(--text-muted); font-weight: 400; }

/* Calendar */
.calendar { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 24px; align-items: start; }
.day { position: relative; display: grid; grid-template-columns: 54px minmax(0, 1fr); }
.hours { position: relative; }
.hour { height: 52px; font: 400 12px var(--font-mono); color: var(--text-muted); transform: translateY(-7px); }
.track { position: relative; border-left: 1px solid var(--border); }
.track .line { position: absolute; left: 0; right: 0; border-top: 1px solid var(--border); opacity: 0.6; }
.event { position: absolute; border: 1px solid var(--border); border-left: 3px solid var(--accent); background: var(--surface); border-radius: 6px; padding: 4px 8px; overflow: hidden; text-align: left; font-size: 13px; color: var(--text-primary); }
.event:hover { background: var(--raised); }
.event.selected { background: var(--raised); border-color: var(--accent); }
.event .event-time { font: 400 11px var(--font-mono); color: var(--text-muted); }
.event .event-title { font-weight: 600; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.event.personal { border-left-color: var(--text-muted); }
.event.conflict { border-left-color: var(--modified); }
.now { position: absolute; left: -6px; right: 0; border-top: 2px solid var(--accent); }
.now::before { content: ''; position: absolute; left: 0; top: -6px; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); }
.now span { position: absolute; right: 0; top: -20px; font: 600 11px var(--font-mono); color: var(--accent); }
.prep { padding: 16px 18px; display: flex; flex-direction: column; gap: 12px; }
.prep h3 { margin: 0; font-size: 18px; color: var(--text-primary); }
.prep .meta { font: 400 13px var(--font-mono); color: var(--text-muted); }
.prep ul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 6px; }
.warning-line { color: var(--modified); font-weight: 600; font-size: 13px; }

/* Kanban */
.board-wrap { overflow-x: auto; padding-bottom: 6px; }
.board { display: grid; grid-template-columns: repeat(5, minmax(180px, 1fr)); gap: 12px; min-width: 940px; }
.column { display: flex; flex-direction: column; gap: 8px; padding: 10px; border-radius: 10px; background: var(--surface); border: 1px solid var(--border); }
.column-head { display: flex; justify-content: space-between; align-items: center; font: 600 12px var(--font-body); letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-muted); padding: 2px 4px 4px; }
.work-card { display: flex; flex-direction: column; gap: 6px; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--stage); }
.work-card .top { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.repo { font: 400 11px var(--font-mono); color: var(--text-muted); }
.work-card .work-title { color: var(--text-primary); font-weight: 600; line-height: 1.35; }
.work-card .work-meta { font-size: 12px; color: var(--text-muted); }
.trail { font: 400 11px var(--font-mono); color: var(--accent); }
.flag { font-size: 12px; font-weight: 600; color: var(--accent); }
.leftovers { margin-top: 18px; display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px; }
.leftover { padding: 10px 12px; border: 1px dashed var(--border); border-radius: 8px; font-size: 13px; color: var(--text-secondary); display: flex; flex-direction: column; gap: 4px; }
.leftover .command { font: 400 12px var(--font-mono); color: var(--text-muted); overflow-wrap: anywhere; }

/* Quiet slide */
.quiet-slide { min-height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: flex-start; gap: 10px; padding: 0 6%; }
.quiet-mark { width: 44px; height: 44px; border-radius: 50%; border: 2px solid var(--added); display: grid; place-items: center; color: var(--added); font-weight: 700; font-size: 20px; }
.quiet-slide h3 { margin: 0; font-size: 30px; color: var(--text-primary); }
.quiet-slide p { margin: 0; color: var(--text-muted); max-width: 60ch; }
.skip-meter { width: 220px; height: 4px; border-radius: 2px; background: var(--border); overflow: hidden; }
.skip-meter div { height: 100%; background: var(--added); transform-origin: 0 0; transform: scaleX(0); }

/* Slack-style messages */
.chat { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 18px; align-items: start; }
.chat-group { display: flex; flex-direction: column; gap: 8px; }
.message { display: grid; grid-template-columns: 36px minmax(0, 1fr); gap: 10px; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); }
.avatar { width: 36px; height: 36px; border-radius: 6px; display: grid; place-items: center; font-weight: 700; color: #ffffff; font-size: 14px; }
.message .who { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.message .name { font-weight: 700; color: var(--text-primary); font-size: 15px; }
.message .when { font-size: 12px; color: var(--text-muted); }
.message .channel { font: 400 12px var(--font-mono); color: var(--text-muted); }
.message .body { color: var(--text-primary); font-size: 15px; margin-top: 2px; overflow-wrap: anywhere; }
.mention { background: color-mix(in srgb, var(--accent) 20%, transparent); color: var(--accent); border-radius: 4px; padding: 0 3px; font-weight: 600; }
.message .footer { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 6px; font-size: 13px; }
.reaction { border: 1px solid var(--border); border-radius: 999px; padding: 0 8px; font-size: 12px; color: var(--text-secondary); }
.thread { color: var(--accent); font-weight: 600; }
.skipped { font-size: 13px; color: var(--text-muted); }

/* Mail */
.mail { display: flex; flex-direction: column; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; background: var(--surface); max-width: 980px; }
.mail-row { display: grid; grid-template-columns: 170px minmax(0, 1fr) auto; gap: 14px; align-items: baseline; padding: 12px 16px; border-bottom: 1px solid var(--border); }
.mail-row:last-child { border-bottom: 0; }
.mail-row .from { font-weight: 600; color: var(--text-primary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mail-row .subject { color: var(--text-primary); }
.mail-row .snippet { color: var(--text-muted); }
.mail-row.dim .from, .mail-row.dim .subject { color: var(--text-muted); font-weight: 400; }

/* Notes and accordions */
.columns-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 18px; align-items: start; }
.task-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.task { display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 8px; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); color: var(--text-primary); }
.box { width: 14px; height: 14px; border: 1.5px solid var(--text-muted); border-radius: 3px; margin-top: 3px; }
.box.partial { background: linear-gradient(135deg, transparent 45%, var(--text-muted) 45%, var(--text-muted) 55%, transparent 55%); }
.task small { display: block; color: var(--text-muted); font-size: 12px; margin-top: 2px; }
details.fold { border: 1px solid var(--border); border-radius: 8px; background: var(--surface); }
details.fold + details.fold { margin-top: 8px; }
details.fold summary { cursor: pointer; padding: 10px 12px; color: var(--text-primary); font-weight: 600; list-style-position: inside; }
details.fold .fold-body { padding: 0 14px 12px; color: var(--text-secondary); }
.diff { font: 400 12px/1.6 var(--font-mono); background: var(--stage); border-radius: 6px; padding: 8px 10px; overflow-x: auto; white-space: pre; margin-top: 8px; }
.diff .plus { color: var(--added); }
.diff .minus { color: var(--removed); }

/* Retro */
.retro { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; align-items: start; }
.suggestion { display: flex; flex-direction: column; gap: 10px; padding: 16px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); }
.suggestion h3 { margin: 0; font-size: 16px; color: var(--text-primary); }
.suggestion .observed { padding-left: 12px; border-left: 3px solid var(--border); color: var(--text-secondary); }
.suggestion .target { font: 400 12px var(--font-mono); color: var(--text-muted); }
.choice-row { display: flex; gap: 8px; flex-wrap: wrap; }
.choice { border: 1px solid var(--border); background: none; border-radius: 8px; padding: 5px 12px; font-size: 13px; color: var(--text-secondary); }
.choice:hover { border-color: var(--accent); }
.choice.selected { background: var(--accent-strong); border-color: var(--accent-strong); color: var(--on-accent); }

/* Warm-up */
.puzzles { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; }
.puzzle { display: flex; flex-direction: column; gap: 10px; padding: 16px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); }
.puzzle .question { color: var(--text-primary); font-size: 17px; }
.puzzle form { display: flex; gap: 8px; }
.puzzle input { flex: 1; min-width: 0; background: var(--stage); border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px; color: var(--text-primary); font: 400 14px var(--font-mono); }
.puzzle .result { font-size: 13px; min-height: 18px; color: var(--text-muted); }
.puzzle .result.right { color: var(--added); }

/* Controls: the chapter row plays one area and stops; the overall row plays through and skims quiet areas. */
.controls { grid-column: 2; border-top: 1px solid var(--border); background: var(--stage); padding: 10px 24px calc(14px + env(safe-area-inset-bottom, 0px)); display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 8px 14px; align-items: center; }
.play-button { display: flex; align-items: center; gap: 8px; border: 1px solid var(--border); background: var(--surface); border-radius: 999px; padding: 6px 14px 6px 10px; font-weight: 600; font-size: 13px; color: var(--text-primary); min-width: 132px; }
.play-button .icon { width: 18px; text-align: center; }
.play-button.active { background: var(--accent-strong); border-color: var(--accent-strong); color: var(--on-accent); }
.bar { display: flex; gap: 4px; height: 14px; align-items: center; cursor: pointer; min-width: 0; }
.segment { position: relative; height: 5px; border-radius: 3px; background: var(--border); overflow: hidden; min-width: 6px; }
.segment.current { height: 7px; }
.segment.quiet { background: color-mix(in srgb, var(--added) 30%, var(--border)); }
.segment-fill { position: absolute; inset: 0; background: var(--accent); transform-origin: 0 0; transform: scaleX(0); }
.bar:hover .segment { height: 8px; }
.time { font: 400 12px var(--font-mono); color: var(--text-muted); min-width: 92px; text-align: right; font-variant-numeric: tabular-nums; }
.options { grid-column: 1 / -1; display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
.options .spacer { flex: 1; }
.segmented { display: flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
.segmented button { border: 0; background: none; padding: 5px 11px; font-size: 12px; color: var(--text-muted); }
.segmented button.selected { background: var(--selection); color: var(--text-primary); }
.option-label { font-size: 12px; color: var(--text-muted); }
.step-button { border: 1px solid var(--border); background: none; border-radius: 8px; padding: 5px 11px; font-size: 12px; color: var(--text-secondary); }
.step-button:disabled { opacity: 0.4; cursor: default; }

@media (max-width: 860px) {
	body { overflow: auto; }
	#app { display: flex; flex-direction: column; height: auto; min-height: 100%; }
	.sidebar { border-right: 0; border-bottom: 1px solid var(--border); padding: 12px 16px; gap: 10px; }
	.chapter-list { flex-direction: row; overflow-x: auto; gap: 6px; }
	.chapter-row { width: auto; flex: none; border: 1px solid var(--border); }
	.note-row, .legend, .sidebar .section-heading { display: none; }
	.header, .stage { padding-left: 16px; padding-right: 16px; }
	.caption { margin: 0 16px 10px; }
	.controls { position: sticky; bottom: 0; padding-left: 16px; padding-right: 16px; grid-template-columns: auto minmax(0, 1fr); }
	.controls .time { grid-column: 1 / -1; text-align: left; }
	.overview, .calendar { grid-template-columns: minmax(0, 1fr); }
	.mail-row { grid-template-columns: minmax(0, 1fr); gap: 2px; }
	.play-button { min-width: 0; }
}
@media (prefers-reduced-motion: reduce) {
	* { transition: none !important; }
}
</style>

<div id="app">
	<aside class="sidebar">
		<div class="brief-title">
			<h1>Morning brief</h1>
			<p>Mon 12 Oct · since Fri 17:40</p>
		</div>
		<div>
			<div class="section-heading">Areas</div>
			<nav class="chapter-list" id="chapter-list"></nav>
		</div>
		<div class="legend">
			<span><span class="status needs">2</span> items need you</span>
			<span><span class="status fyi">4</span> worth knowing</span>

	const events = calendarEvents.map((event) => {

		const width = 100 / event.lanes;
		const time = `${formatHour(event.start)}–${formatHour(event.end)}`;
		const kindClass = event.kind === 'work' ? '' : event.kind;
		return `<button class="event ${kindClass} ${event.id === selectedEvent ? 'selected' : ''}" type="button" data-event="${event.id}" data-target="event-${event.id}"
			style="top:${top}px;height:${height}px;left:calc(${event.lane * width}% + 6px);width:calc(${width}% - 12px)">
			<span class="event-title">${event.title}</span><span class="event-time">${time}</span></button>`;
	}).join('');
	return `
		<div class="calendar">
			<div class="day">
				<div class="hours">${hours.join('')}</div>
				<div class="track" style="height:${(lastHour - firstHour) * hourHeight}px">

function formatHour(value) {
	const hours = Math.floor(value);

	return `<div class="puzzles">${puzzles.map(([question, answer], index) => `
		<form class="puzzle" data-answer="${answer}">
			<div class="group-label">Puzzle ${index + 1}</div>
			<div class="question">${question}</div>
			<div style="display:flex;gap:8px">
				<label class="option-label" for="puzzle-${index}" hidden>Answer</label>
				<input id="puzzle-${index}" autocomplete="off" placeholder="Your answer">
				<button class="choice" type="submit">Check</button>
				<button class="choice" type="button" data-reveal>Reveal</button>
			</div>
			<div class="result"></div>
		</form>`).join('')}</div>`;
}

/* Player: chapters hold beats; a beat lasts its estimated speech time, or its hold for quiet areas. */
const SPEEDS = { slow: { label: 'Slow', rate: 0.85 }, normal: { label: 'Normal', rate: 1 }, fast: { label: 'Fast', rate: 1.3 } };
const state = { chapter: 0, beat: 0, elapsed: 0, playing: false, mode: 'all', speed: 'normal', voice: false, finished: false, speaking: false };
const voiceAvailable = 'speechSynthesis' in window;
const byId = (id) => document.getElementById(id);
const stage = byId('stage');

const beatSeconds = (beat) => (beat.hold ?? beat.say.split(/\s+/).length / 2.6 + 0.9) / SPEEDS[state.speed].rate;
const chapterSeconds = (chapter) => chapter.beats.reduce((total, beat) => total + beatSeconds(beat), 0);
const currentChapter = () => chapters[state.chapter];
const currentBeat = () => currentChapter().beats[state.beat];
const formatTime = (seconds) => `${Math.floor(seconds / 60)}:${String(Math.floor(seconds % 60)).padStart(2, '0')}`;

function setChapter(index, beatIndex = 0) {
	state.chapter = index;
	state.finished = false;
	const chapter = currentChapter();
	byId('kicker').textContent = chapter.kicker;
	byId('title').textContent = chapter.title;
	stage.innerHTML = chapter.render();
	stage.scrollTop = 0;
	buildBars();
	setBeat(beatIndex);
}

function setBeat(index) {
	state.beat = index;
	state.elapsed = 0;
	const beat = currentBeat();
	if (beat.select && beat.select !== selectedEvent) {
		selectedEvent = beat.select;
		stage.innerHTML = currentChapter().render();
	}
	stage.querySelectorAll('.highlighted').forEach((element) => element.classList.remove('highlighted'));
	for (const target of beat.targets) stage.querySelectorAll(`[data-target="${target}"]`).forEach((element) => element.classList.add('highlighted'));
	stage.classList.toggle('highlighting', beat.targets.length > 0);
	byId('caption-text').textContent = beat.say;
	renderSidebar();
	renderButtons();
	speak();
}

function speak() {
	if (!voiceAvailable) return;
	window.speechSynthesis.cancel();
	state.speaking = false;
	if (!state.voice || !state.playing) return;
	const utterance = new SpeechSynthesisUtterance(currentBeat().say);
	utterance.rate = SPEEDS[state.speed].rate;
	const voices = window.speechSynthesis.getVoices().filter((voice) => voice.lang.startsWith('en'));
	utterance.voice = voices.find((voice) => /natural|online/i.test(voice.name)) ?? voices[0] ?? null;
	utterance.onend = utterance.onerror = () => { state.speaking = false; };
	state.speaking = true;
	window.speechSynthesis.speak(utterance);
}

function advance() {
	const chapter = currentChapter();
	if (state.beat < chapter.beats.length - 1) return setBeat(state.beat + 1);
	if (state.mode === 'all' && state.chapter < chapters.length - 1) return setChapter(state.chapter + 1);
	state.playing = false;
	state.finished = true;
	state.elapsed = beatSeconds(currentBeat());
	renderButtons();
}

function play(mode) {
	if (state.playing && state.mode === mode) return pause();
	state.mode = mode;
	if (state.finished) {
		if (mode === 'all' && state.chapter === chapters.length - 1) setChapter(0);
		else if (mode === 'chapter') setChapter(state.chapter);
		else setChapter(state.chapter + 1);
	}
	state.playing = true;
	speak();
	renderButtons();
}

function pause() {
	state.playing = false;
	if (voiceAvailable) window.speechSynthesis.cancel();
	state.speaking = false;
	renderButtons();
}

function step(direction) {
	const chapter = currentChapter();
	const next = state.beat + direction;
	if (next >= 0 && next < chapter.beats.length) return setBeat(next);
	const nextChapter = state.chapter + direction;
	if (nextChapter < 0 || nextChapter >= chapters.length) return;
	setChapter(nextChapter, direction < 0 ? chapters[nextChapter].beats.length - 1 : 0);
}

let lastFrame = 0;
function frame(now) {
	const delta = lastFrame ? (now - lastFrame) / 1000 : 0;
	lastFrame = now;
	if (state.playing) {
		const duration = beatSeconds(currentBeat());
		state.elapsed += delta;
		if (state.speaking) state.elapsed = Math.min(state.elapsed, duration * 0.97);
		else if (state.elapsed >= duration) advance();
	}
	paintProgress();
	requestAnimationFrame(frame);
}

function buildBars() {
	const chapter = currentChapter();
	byId('chapter-bar').replaceChildren(...chapter.beats.map((beat, index) => {
		const segment = document.createElement('div');
		segment.className = 'segment';
		segment.style.flex = `${beatSeconds(beat)} 1 0`;
		segment.title = beat.note;
		segment.innerHTML = '<div class="segment-fill"></div>';
		segment.addEventListener('click', () => setBeat(index));
		return segment;
	}));
	byId('overall-bar').replaceChildren(...chapters.map((candidate, index) => {
		const segment = document.createElement('div');
		segment.className = `segment ${candidate.status === 'quiet' ? 'quiet' : ''}`;
		segment.style.flex = `${chapterSeconds(candidate)} 1 0`;
		segment.title = candidate.name;
		segment.innerHTML = '<div class="segment-fill"></div>';
		segment.addEventListener('click', () => setChapter(index));
		return segment;
	}));
}

function paintProgress() {
	const chapter = currentChapter();
	const beatDuration = beatSeconds(currentBeat());
	const beatFraction = Math.min(1, state.elapsed / beatDuration);
	byId('chapter-bar').querySelectorAll('.segment').forEach((segment, index) => {
		segment.classList.toggle('current', index === state.beat);
		const fill = index < state.beat ? 1 : index === state.beat ? beatFraction : 0;
		segment.firstChild.style.transform = `scaleX(${fill})`;
	});
	const chapterElapsed = chapter.beats.slice(0, state.beat).reduce((total, beat) => total + beatSeconds(beat), 0) + Math.min(state.elapsed, beatDuration);
	const chapterTotal = chapterSeconds(chapter);
	byId('overall-bar').querySelectorAll('.segment').forEach((segment, index) => {
		segment.classList.toggle('current', index === state.chapter);
		const fill = index < state.chapter ? 1 : index === state.chapter ? chapterElapsed / chapterTotal : 0;
		segment.firstChild.style.transform = `scaleX(${fill})`;
	});
	const before = chapters.slice(0, state.chapter).reduce((total, candidate) => total + chapterSeconds(candidate), 0);
	const total = chapters.reduce((sum, candidate) => sum + chapterSeconds(candidate), 0);
	byId('chapter-time').textContent = `${formatTime(chapterElapsed)} / ${formatTime(chapterTotal)}`;
	byId('overall-time').textContent = `${formatTime(before + chapterElapsed)} / ${formatTime(total)}`;
	const skip = byId('skip-fill');
	if (skip) skip.style.transform = `scaleX(${chapterElapsed / chapterTotal})`;
}

function renderButtons() {
	const chapterPlaying = state.playing && state.mode === 'chapter';
	const allPlaying = state.playing && state.mode === 'all';
	byId('chapter-play').className = `play-button ${chapterPlaying ? 'active' : ''}`;
	byId('chapter-play').innerHTML = `<span class="icon">${chapterPlaying ? '❚❚' : '▶'}</span>${chapterPlaying ? 'Pause' : 'This area'}`;
	byId('all-play').className = `play-button ${allPlaying ? 'active' : ''}`;
	byId('all-play').innerHTML = `<span class="icon">${allPlaying ? '❚❚' : '▶'}</span>${allPlaying ? 'Pause' : 'Play brief'}`;
	byId('previous').disabled = state.chapter === 0 && state.beat === 0;
	byId('next').disabled = state.chapter === chapters.length - 1 && state.beat === currentChapter().beats.length - 1;
}

function renderSidebar() {
	const list = byId('chapter-list');
	list.replaceChildren();
	chapters.forEach((chapter, index) => {
		const row = document.createElement('button');
		row.type = 'button';
		row.className = `chapter-row ${index === state.chapter ? 'current' : ''} ${chapter.status === 'quiet' ? 'quiet' : ''}`;
		const status = chapter.status === 'quiet' ? '<span class="status quiet">quiet</span>' : `<span class="status ${chapter.status}">${chapter.count}</span>`;
		row.innerHTML = `<span class="number">${index + 1}</span><span class="name">${chapter.name}</span>${status}`;
		row.addEventListener('click', () => setChapter(index));
		list.append(row);
		if (index !== state.chapter || chapter.status === 'quiet') return;
		chapter.beats.forEach((beat, beatIndex) => {
			const note = document.createElement('button');
			note.type = 'button';
			note.className = `note-row ${beatIndex === state.beat ? 'current' : beatIndex < state.beat ? 'done' : ''}`;
			note.textContent = beat.note;
			note.addEventListener('click', () => setBeat(beatIndex));
			list.append(note);
		});
	});
}

function renderOptions() {
	byId('speed').replaceChildren(...Object.entries(SPEEDS).map(([key, { label }]) => {
		const button = document.createElement('button');
		button.type = 'button';
		button.textContent = label;
		button.className = key === state.speed ? 'selected' : '';
		button.addEventListener('click', () => { state.speed = key; buildBars(); renderOptions(); speak(); });
		return button;
	}));
	byId('voice').replaceChildren(...[['Captions', false], ['Browser voice', true]].map(([label, value]) => {
		const button = document.createElement('button');
		button.type = 'button';
		button.textContent = label;
		button.disabled = value && !voiceAvailable;
		button.className = state.voice === value ? 'selected' : '';
		button.addEventListener('click', () => { state.voice = value; renderOptions(); speak(); });
		return button;
	}));
}

stage.addEventListener('click', (event) => {
	const goto = event.target.closest('[data-goto]');
	if (goto) {
		event.preventDefault();
		return setChapter(chapters.findIndex((chapter) => chapter.id === goto.dataset.goto));
	}
	const calendarEvent = event.target.closest('[data-event]');
	if (calendarEvent) {
		selectedEvent = calendarEvent.dataset.event;
		stage.querySelectorAll('.event').forEach((element) => element.classList.toggle('selected', element.dataset.event === selectedEvent));
		byId('prep').innerHTML = renderPrep();
		return;
	}
	const retro = event.target.closest('[data-retro]');
	if (retro) {
		retroChoices[retro.dataset.retro] = retro.dataset.choice;
		try { localStorage.setItem('morning-brief-retro', JSON.stringify(retroChoices)); } catch {}
		retro.parentElement.querySelectorAll('.choice').forEach((button) => button.classList.toggle('selected', button === retro));
		return;
	}
	const reveal = event.target.closest('[data-reveal]');
	if (reveal) {
		const form = reveal.closest('form');
		form.querySelector('.result').textContent = `Answer: ${form.dataset.answer}`;
		return;
	}
	if (event.target.closest('a[href="#"]')) event.preventDefault();
});
stage.addEventListener('submit', (event) => {
	event.preventDefault();
	const form = event.target;
	const given = form.querySelector('input').value.trim().replace(',', '.');
	const result = form.querySelector('.result');
	const right = Number(given) === Number(form.dataset.answer);
	result.className = `result ${right ? 'right' : ''}`;
	result.textContent = right ? 'Correct.' : 'Not quite. Try again or reveal.';
});

byId('chapter-play').addEventListener('click', () => play('chapter'));
byId('all-play').addEventListener('click', () => play('all'));
byId('previous').addEventListener('click', () => step(-1));
byId('next').addEventListener('click', () => step(1));
document.addEventListener('keydown', (event) => {
	if (event.target.closest('input, textarea')) return;
	if (event.key === ' ') { event.preventDefault(); play('all'); }
	if (event.key === 'ArrowRight') step(1);
	if (event.key === 'ArrowLeft') step(-1);
});

renderOptions();
setChapter(0);
renderButtons();
requestAnimationFrame(frame);
</script>
