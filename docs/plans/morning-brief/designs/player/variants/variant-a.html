<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Morning brief player, variant A</title>
<link rel="stylesheet" href="../../tokens.css">
<style>
:root {
	--ink-muted: color-mix(in srgb, var(--ink) 82%, white);
	--line: color-mix(in srgb, var(--ink) 16%, white);
	--warn-ink: color-mix(in srgb, var(--warn) 50%, var(--ink));
	--fail-ink: color-mix(in srgb, var(--fail) 78%, var(--ink));
	--done-ink: color-mix(in srgb, var(--done) 72%, var(--ink));
	--sticky-soft: color-mix(in srgb, var(--sticky) 40%, white);
	--dot: color-mix(in srgb, var(--ink) 13%, transparent);
	--column-width: var(--reading-width);
	/* Native chrome colours, used only inside the matching app window for fidelity. */
	--gcal-grid: #dadce0;
	--gmail-surface: #f6f8fc;
	--github-board: #f6f8fa;
	--gitlab-board: #fbfafd;
	--obsidian-bar: #262626;
	--terminal-bar: #2d2d2d;
	--dark-text: #e3e3e3;
	--dark-muted: #a8a8a8;
	--obsidian-accent: #a88bfa;
	--terminal-warning: #ffc66d;
	--claude: #d97757;
	--gemini: #8e75b2;
	--hacker-news: #f0652f;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
	margin: 0; overflow: hidden; color: var(--ink);
	background-color: var(--desk);
	background-image: radial-gradient(var(--dot) 1.5px, transparent 1.6px);
	background-size: 24px 24px;
	font: 400 15px/1.45 var(--font-body);
}
button, select, input { font: inherit; color: inherit; }
button { cursor: pointer; }
h1, h2, h3, p, ol, ul { margin: 0; }
ol, ul { padding: 0; list-style: none; }
a { color: inherit; }
:focus-visible { outline: 3px dashed currentColor; outline-offset: 3px; border-radius: 4px; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--ink-muted); }
.visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
svg { flex: none; }

/* Shell */
.app { display: grid; grid-template-columns: 264px minmax(0, 1fr); height: 100vh; }
.outline {
	margin: 16px 0 16px 16px; padding: 14px 10px; min-height: 0; overflow-y: auto;
	background: var(--paper); border: var(--border-width) solid var(--ink); border-radius: var(--radius-panel); box-shadow: var(--shadow-ordinary);
}
.outline-date { padding: 2px 8px 12px; margin-bottom: 10px; border-bottom: 2px dashed var(--line); }
.outline-weekday { display: block; font: 600 26px/1.1 var(--font-head); }
.outline-weekday-short { display: none; font: 600 18px/1.1 var(--font-head); }
.outline-day { display: block; font: 500 16px/1.3 var(--font-head); }
.outline-window { display: block; margin-top: 4px; font-size: 12px; color: var(--ink-muted); }
.chapter-list { display: flex; flex-direction: column; gap: 2px; }
.chapter-row {
	position: relative; display: flex; align-items: center; gap: 10px; width: 100%; padding: 6px 8px;
	border: 2px solid transparent; border-radius: 10px; background: none; text-align: left; font-weight: 600; font-size: 14.5px;
	transition: transform var(--duration-normal) var(--ease-spring), background-color var(--duration-fast), box-shadow var(--duration-fast);
}
.chapter-row:hover { background: var(--desk); border-color: var(--ink); transform: translateY(-2px); box-shadow: var(--shadow-compact); }
.chapter-item.is-current > .chapter-row { background: var(--fill-review); border-color: var(--ink); box-shadow: var(--shadow-compact); }
.chapter-icon { display: inline-grid; place-items: center; width: 22px; height: 22px; }
.chapter-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chapter-item.is-quiet .chapter-name { color: var(--ink-muted); font-weight: 500; }
.marker { display: inline-grid; place-items: center; min-width: 24px; height: 22px; padding: 0 6px; border-radius: var(--radius-badge); font: 600 12px var(--font-mono); font-variant-numeric: tabular-nums; }
.marker-needs { background: var(--sticky); color: var(--on-sticky); border: 2px solid var(--ink); }
.marker-fyi, .marker-quiet { color: var(--ink-muted); }
.source-warning { display: inline-grid; place-items: center; color: var(--warn-ink); }
.beat-list { display: flex; flex-direction: column; gap: 2px; margin: 4px 0 8px 30px; }
.beat-row {
	display: flex; align-items: center; gap: 6px; width: 100%; padding: 3px 8px; text-align: left;
	border: 2px solid transparent; border-radius: var(--radius-button); background: none; font-size: 13.5px; color: var(--ink-muted);
	transition: transform var(--duration-normal) var(--ease-spring), background-color var(--duration-fast);
}
.beat-row:hover { background: var(--desk); transform: translateY(-2px); }
.beat-row.is-done { color: var(--ink); }
.beat-row.is-current { background: var(--sticky-soft); border-color: var(--ink); color: var(--ink); font-weight: 600; }

.main { position: relative; display: grid; grid-template-rows: minmax(0, 1fr) auto auto; min-width: 0; min-height: 0; padding: 14px 24px 16px; }
.variant-tag {
	position: absolute; top: 12px; right: 18px; z-index: 5; padding: 3px 9px; transform: rotate(1deg);
	font: 500 11px var(--font-mono); color: var(--ink-muted); background: var(--paper); border: 1.5px solid var(--ink); border-radius: var(--radius-button);
}
.variant-tag-short { display: none; }
.column { width: min(100%, var(--column-width)); margin-inline: auto; display: flex; flex-direction: column; min-height: 0; }
.chapter-header { display: flex; align-items: center; gap: 12px; padding: 6px 0 8px; }
.chapter-header .chapter-icon { width: 30px; height: 30px; }
.kicker { font-size: 13px; font-weight: 600; color: var(--ink-muted); display: flex; gap: 8px; align-items: baseline; }
.chapter-title { font: 600 26px/1.15 var(--font-head); text-wrap: balance; }
.stage { flex: 1; min-height: 0; overflow: auto; padding: 10px 14px 18px; margin: 0 -14px; }

.caption-row { width: min(100%, var(--column-width)); margin: 4px auto 0; }
.caption {
	display: flex; align-items: baseline; gap: 12px; min-height: 52px; padding: 12px 16px;
	background: var(--paper); border: var(--border-width) solid var(--ink); border-radius: 12px; box-shadow: var(--shadow-compact);
	font-size: 18px; font-weight: 500; line-height: 1.35;
}
.caption-text { flex: 1; }
.caption-count { font-size: 12px; color: var(--ink-muted); }

.transport {
	width: min(100%, 1000px); margin: 12px auto 0; display: flex; align-items: center; gap: 14px; padding: 8px 14px;
	background: var(--paper); border: var(--border-width) solid var(--ink); border-radius: var(--radius-panel); box-shadow: var(--shadow-ordinary);
}
.transport-buttons { display: flex; align-items: center; gap: 4px; }
.icon-button, .icon-link {
	display: inline-flex; align-items: center; justify-content: center; gap: 4px; min-width: 32px; height: 32px; padding: 0 5px;
	border: 2px solid transparent; border-radius: var(--radius-button); background: transparent; color: inherit; text-decoration: none;
	transition: transform var(--duration-normal) var(--ease-spring), background-color var(--duration-fast), box-shadow var(--duration-fast);
}
.icon-button:hover:not(:disabled), a.icon-link:hover { background: color-mix(in srgb, currentColor 10%, transparent); border-color: currentColor; transform: translateY(-2px); }
.icon-button:active:not(:disabled), a.icon-link:active { transform: translateY(1px); }
.icon-button:disabled { opacity: 0.4; cursor: default; }
.transport .icon-button { min-width: 38px; height: 38px; }
.play-button.icon-button {
	width: 48px; height: 48px; margin: 0 4px; background: var(--brand); color: var(--ink); border: var(--border-width) solid var(--ink); border-radius: 12px; box-shadow: var(--shadow-ordinary);
}
.play-button.icon-button:hover { background: var(--brand-bright); border-color: var(--ink); box-shadow: var(--shadow-lifted); }
.progress { flex: 1; display: flex; align-items: center; gap: 4px; min-width: 120px; height: 24px; }
.segment {
	position: relative; flex-basis: 0; min-width: 10px; height: 12px; padding: 0; overflow: hidden;
	background: var(--paper); border: 2px solid var(--ink); border-radius: 6px; transition: height var(--duration-fast);
}
.segment:hover { height: 16px; }
.segment.is-current { height: 16px; }
.segment.is-quiet { border-style: dashed; }
.segment-fill { position: absolute; inset: 0; background: var(--brand); transform-origin: 0 50%; transform: scaleX(0); }
.tick { position: absolute; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: var(--ink); opacity: 0.55; }
.time { font-size: 13px; color: var(--ink-muted); white-space: nowrap; }
.speed-value { font: 600 12px var(--font-mono); }

/* Highlight: outline ring plus lift; the rest stays readable. */
[data-target] { position: relative; transition: opacity var(--duration-slow) var(--ease-standard), transform var(--duration-normal) var(--ease-spring), box-shadow var(--duration-normal) var(--ease-standard); }
.stage.is-highlighting [data-target]:not(.is-target, .is-path) { opacity: 0.78; }
.is-target { z-index: 2; transform: translateY(-2px); box-shadow: inset 0 0 0 3px var(--sticky), 0 0 0 2.5px var(--ink), 4px 4px 0 2.5px var(--ink) !important; }

/* Shared pieces */
.paper { background: var(--paper); border: var(--border-width) solid var(--ink); border-radius: var(--radius-panel); box-shadow: var(--shadow-ordinary); }
.window { background: var(--body-bg, var(--paper)); border: var(--border-width) solid var(--ink); border-radius: var(--radius-panel); box-shadow: var(--shadow-ordinary); color: var(--body-text, var(--ink)); }
.window-bar {
	display: flex; align-items: center; gap: 8px; min-height: 40px; padding: 3px 8px 3px 12px;
	background: var(--bar-bg, var(--paper)); color: var(--bar-text, var(--ink)); border-bottom: var(--border-width) solid var(--ink);
	border-radius: calc(var(--radius-panel) - 3px) calc(var(--radius-panel) - 3px) 0 0; font-size: 14px; font-weight: 600;
}
.window-context { font-weight: 400; color: var(--bar-muted, var(--ink-muted)); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.window-actions { margin-left: auto; display: flex; align-items: center; gap: 4px; }
.window-body { padding: var(--space-3); }
.theme-gmail { --bar-bg: var(--gmail-surface); --body-bg: var(--gmail-surface); }
.theme-slack { --bar-bg: var(--slack); --bar-text: #ffffff; --bar-muted: color-mix(in srgb, #ffffff 82%, var(--slack)); }
.theme-gitlab { --body-bg: var(--gitlab-board); }
.theme-github { --bar-bg: var(--github-board); --body-bg: var(--github-board); }
.theme-obsidian { --bar-bg: var(--obsidian-bar); --body-bg: var(--terminal); --bar-text: var(--dark-text); --bar-muted: var(--dark-muted); --body-text: var(--dark-text); }
.theme-terminal { --bar-bg: var(--terminal-bar); --body-bg: var(--terminal); --bar-text: var(--dark-text); --bar-muted: var(--dark-muted); --body-text: var(--dark-text); }
.quiet-line { margin-top: var(--space-3); font-size: 14px; color: var(--ink-muted); }
.switch {
	position: relative; flex: none; width: 42px; height: 24px; padding: 0; border: 2px solid var(--ink); border-radius: 999px; background: var(--fill-draft);
	transition: background-color var(--duration-fast);
}
.switch::after {
	content: ''; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: var(--paper); border: 2px solid var(--ink);
	transition: transform var(--duration-normal) var(--ease-spring);
}
.switch[aria-checked="true"] { background: var(--done); }
.switch[aria-checked="true"]::after { transform: translateX(18px); }
.text-button {
	display: inline-flex; align-items: center; gap: 8px; padding: 9px 16px; font-weight: 600; font-size: 15px;
	background: var(--brand); color: var(--ink); border: var(--border-width) solid var(--ink); border-radius: var(--radius-button); box-shadow: var(--shadow-ordinary);
	transition: transform var(--duration-normal) var(--ease-spring), box-shadow var(--duration-fast), background-color var(--duration-fast);
}
.text-button:hover:not(:disabled) { transform: translateY(-2px); box-shadow: var(--shadow-lifted); background: var(--brand-bright); }
.text-button:active:not(:disabled) { transform: translateY(1px); box-shadow: var(--shadow-compact); }
.text-button:disabled { background: var(--fill-draft); color: var(--ink-muted); box-shadow: none; cursor: default; }
.text-button.is-confirmed { background: var(--fill-ready); }

/* Overview */
.overview { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: var(--space-8); align-items: start; padding-top: var(--space-2); }
.date-note {
	padding: var(--space-5) var(--space-4); transform: rotate(-1.5deg);
	background: var(--sticky); color: var(--on-sticky); border: var(--border-width) solid var(--ink); border-radius: 12px; box-shadow: var(--shadow-ordinary);
}
.date-weekday { display: block; font: 600 40px/1 var(--font-head); }
.date-day { display: block; margin-top: 6px; font: 500 22px/1.2 var(--font-head); }
.date-window { display: block; margin-top: 12px; font-size: 12px; }
.needs { display: flex; flex-direction: column; gap: var(--space-3); }
.need {
	display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; gap: var(--space-3); align-items: center; padding: 10px 12px 10px 14px;
	background: var(--paper); border: var(--border-width) solid var(--ink); border-radius: 12px; box-shadow: var(--shadow-compact);
}
.need-text strong { display: block; font-size: 16px; }
.need-text span { font-size: 14px; }
.row-actions { display: flex; gap: 2px; align-items: center; }

/* Google Calendar */
.gcal { display: grid; grid-template-columns: auto 236px; gap: var(--space-5); align-items: start; justify-content: center; }
.gcal-main { --gutter: 58px; --day: 168px; }
.gcal-row { display: grid; grid-template-columns: var(--gutter) repeat(var(--days), var(--day)); }
.gcal-zone { align-self: end; padding: 0 8px 4px 0; text-align: right; font-size: 11px; color: var(--ink-muted); }
.gcal-dayhead { display: flex; flex-direction: column; align-items: center; gap: 2px; padding-bottom: 6px; }
.gcal-weekday { font-size: 14px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-muted); }
.gcal-date { display: grid; place-items: center; width: 42px; height: 42px; border-radius: 50%; font: 500 24px/1 var(--font-head); }
.gcal-dayhead.is-focus .gcal-weekday { color: var(--google-calendar); }
.gcal-dayhead.is-focus .gcal-date { background: var(--google-calendar); color: #ffffff; }
.gcal-allday { min-height: 32px; border-bottom: 1px solid var(--gcal-grid); }
.gcal-allday-cell { display: flex; flex-direction: column; gap: 2px; padding: 3px 4px 4px; border-left: 1px solid var(--gcal-grid); }
.gcal-chip, .gcal-event {
	--fill: color-mix(in srgb, var(--event) 72%, white);
	background: var(--fill); color: var(--ink); border: 1.5px solid var(--paper); border-radius: 6px; text-align: left; font-size: 14px; line-height: 1.2;
}
.gcal-chip { width: 100%; padding: 3px 8px; font-weight: 600; }
.gcal-grid { position: relative; }
.gcal-hours { position: relative; }
.gcal-hour { position: absolute; right: 8px; transform: translateY(-50%); font-size: 13px; color: var(--ink-muted); }
.gcal-day {
	position: relative; border-left: 1px solid var(--gcal-grid);
	background-image: repeating-linear-gradient(to bottom, var(--gcal-grid) 0 1px, transparent 1px var(--hour));
}
.gcal-event { position: absolute; left: 2px; right: 8px; padding: 2px 7px; overflow: hidden; cursor: pointer; display: flex; flex-direction: column; justify-content: flex-start; }
.gcal-event.is-short { flex-direction: row; align-items: center; gap: 4px; white-space: nowrap; }
.gcal-event:not(.is-short) .event-title { white-space: normal; }
.gcal-fact .mono { white-space: nowrap; }
.gcal-event:hover { box-shadow: var(--shadow-compact); }
.gcal-event.is-selected { border: 2px solid var(--ink); box-shadow: var(--shadow-ordinary); }
.event-title { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.event-time { font-size: 13px; }
.gcal-now { position: absolute; left: -1px; right: 0; height: 2px; background: var(--fail); z-index: 3; pointer-events: none; }
.gcal-now::before { content: ''; position: absolute; left: -6px; top: -5px; width: 12px; height: 12px; border-radius: 50%; background: var(--fail); }
.gcal-side { display: flex; flex-direction: column; gap: var(--space-4); }
.gcal-detail { padding: 12px 12px 14px; background: var(--paper); border: var(--border-width) solid var(--ink); border-radius: 12px; box-shadow: var(--shadow-ordinary); }
.gcal-detail-head { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 8px; }
.gcal-detail-head h3 { flex: 1; font-size: 19px; line-height: 1.25; font-weight: 600; }
.swatch { flex: none; display: inline-block; width: 14px; height: 14px; margin-top: 4px; border-radius: 4px; background: var(--event); }
.gcal-fact { display: flex; gap: 8px; align-items: center; font-size: 14px; padding: 3px 0; }
.gcal-note { margin-top: 6px; padding: 5px 8px; background: var(--fill-progress); border-radius: var(--radius-button); font-weight: 600; }
.gcal-legend { display: flex; flex-direction: column; gap: 6px; font-size: 14px; }
.gcal-legend-title { font-size: 13px; font-weight: 600; color: var(--ink-muted); }
.gcal-legend li { display: flex; gap: 8px; align-items: center; }
.gcal-legend .swatch { margin-top: 0; }

/* GitLab and GitHub */
.scope-tabs { display: flex; gap: 4px; }
.scope-tab {
	display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px; font-size: 13.5px; font-weight: 600;
	background: transparent; border: 2px solid transparent; border-radius: var(--radius-button);
	transition: transform var(--duration-normal) var(--ease-spring), background-color var(--duration-fast);
}
.scope-tab:hover { border-color: var(--ink); transform: translateY(-2px); }
.scope-tab[aria-pressed="true"] { background: var(--paper); border-color: var(--ink); box-shadow: var(--shadow-compact); }
.scope-count { font-size: 12px; color: var(--ink-muted); }
.repo + .repo { margin-top: var(--space-4); }
.repo-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; font-weight: 600; }
.mr-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(196px, 1fr)); gap: var(--space-3); }
.mr-card {
	display: flex; flex-direction: column; gap: 4px; padding: 9px 10px 6px; min-height: 104px;
	background: var(--state-fill, var(--paper)); border: 2px solid var(--ink); border-radius: 10px; box-shadow: var(--shadow-compact);
}
.mr-card.is-merged { min-height: 0; }
.mr-top { display: flex; align-items: baseline; gap: 8px; }
.mr-ref { font-weight: 600; font-size: 14px; }
.mr-state { margin-left: auto; font-size: 12px; font-weight: 600; color: var(--ink-muted); text-align: right; }
.mr-title { font-weight: 600; font-size: 14.5px; line-height: 1.3; }
.mr-links { display: flex; align-items: center; gap: 2px; margin-top: auto; }
.state-ready { --state-fill: var(--fill-ready); }
.state-review { --state-fill: var(--fill-review); }
.state-draft, .state-local { --state-fill: var(--fill-draft); }
.state-failing { --state-fill: var(--fill-failing); }
.state-progress, .state-stale { --state-fill: var(--fill-progress); }
.state-merged { --state-fill: var(--fill-merged); }
.pipeline-success { color: var(--done-ink); }
.pipeline-failed { color: var(--fail-ink); }
.pipeline-running { color: var(--warn-ink); }
.ticket-chip, .local-chip { display: inline-flex; align-items: center; gap: 4px; height: 28px; padding: 0 6px; font-size: 13px; border-radius: var(--radius-button); text-decoration: none; border: 2px solid transparent; }
a.ticket-chip:hover { border-color: currentColor; }
.ticket-chip.is-wrong { background: var(--paper); color: var(--warn-ink); border-color: var(--warn-ink); font-weight: 600; }
.auto-line { display: flex; align-items: center; gap: 10px; margin-top: var(--space-4); padding-top: var(--space-3); border-top: 2px dashed var(--line); font-size: 14px; }
.auto-line .auto-text { flex: 1; }

/* Run log */
.runs { display: flex; flex-direction: column; gap: var(--space-2); }
.run { display: grid; grid-template-columns: 28px 22px minmax(0, 1fr) auto auto auto; gap: 12px; align-items: center; padding: 8px 10px; border-radius: 10px; border: 2px solid var(--ink); }
.run-ok { background: var(--fill-merged); }
.run-fail { background: var(--fill-failing); }
.run-outcome { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 7px; border: 2px solid var(--ink); background: var(--paper); }
.run-ok .run-outcome { color: var(--done-ink); }
.run-fail .run-outcome { color: var(--fail-ink); }
.run-title { font-weight: 600; }
.run-when, .run-duration { font-size: 14px; }

/* Slack */
.slack-section + .slack-section { margin-top: var(--space-3); }
.slack-heading { margin-bottom: 4px; font-size: 13px; font-weight: 700; color: var(--ink-muted); }
.slack-message { display: grid; grid-template-columns: 36px minmax(0, 1fr) auto; gap: 10px; padding: 8px 8px 8px 10px; border-radius: 10px; }
.slack-message.is-waiting { background: var(--sticky-soft); }
.slack-message + .slack-message { margin-top: 2px; }
.slack-avatar { display: grid; place-items: center; width: 36px; height: 36px; border-radius: 8px; color: #ffffff; font-weight: 700; font-size: 15px; }
.slack-meta { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.slack-meta strong { font-size: 15px; }
.slack-time, .slack-channel { font-size: 12.5px; color: var(--ink-muted); }
.slack-text { margin-top: 1px; }
.mention { padding: 0 3px; border-radius: 4px; background: var(--sticky); font-weight: 600; }
.slack-replies { display: inline-flex; align-items: center; gap: 4px; margin-top: 3px; font-size: 13px; font-weight: 600; color: var(--brand-deep); }
.slack-handled { margin-top: var(--space-3); padding: 8px 10px; border-radius: 10px; background: var(--fill-merged); }
.slack-summary { display: flex; gap: 8px; align-items: flex-start; font-size: 14.5px; }
.slack-summary svg { margin-top: 2px; color: var(--done-ink); }
.slack-disclosure { margin-top: 6px; }
.slack-disclosure summary { display: inline-flex; align-items: center; gap: 4px; cursor: pointer; font-size: 13.5px; font-weight: 600; list-style: none; border-radius: 6px; padding: 2px 4px; }
.slack-disclosure summary::-webkit-details-marker { display: none; }
.slack-disclosure[open] summary svg { transform: rotate(90deg); }
.slack-disclosure summary svg { transition: transform var(--duration-normal) var(--ease-spring); }
.slack-scroll { max-height: 132px; overflow-y: auto; margin-top: 6px; padding: 2px; background: var(--paper); border: 2px solid var(--line); border-radius: 8px; }
.slack-scroll .slack-message { padding: 6px 8px; }

/* Gmail */
.gmail-list { background: var(--paper); border: 2px solid var(--ink); border-radius: 10px; }
.gmail-row { display: grid; grid-template-columns: 74px 92px minmax(0, 1fr) auto 50px auto; gap: 10px; align-items: center; padding: 8px 8px 8px 12px; }
.gmail-row + .gmail-row { border-top: 1px solid var(--gcal-grid); }
.gmail-row:first-child { border-radius: 8px 8px 0 0; }
.gmail-row:last-child { border-radius: 0 0 8px 8px; }
.gmail-from { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.gmail-subject { min-width: 0; }
.gmail-subject strong { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.gmail-snippet { display: block; font-size: 14px; color: var(--ink-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.gmail-date { font-size: 13px; font-weight: 600; text-align: right; }
.chip { display: inline-block; padding: 2px 8px; border-radius: var(--radius-badge); font-size: 12.5px; font-weight: 600; text-align: center; white-space: nowrap; }
.account-work { background: var(--fill-review); }
.account-personal { background: var(--fill-ready); }
.action-word { border: 2px solid var(--ink); }
.action-renew { background: var(--fill-progress); }
.action-read { background: var(--fill-review); }
.action-optional { background: var(--fill-draft); }
.gmail-foot { margin-top: var(--space-3); font-size: 14px; color: var(--ink-muted); display: flex; gap: 14px; flex-wrap: wrap; }
.gmail-foot b { color: var(--ink); }

/* Obsidian */
.obs-group + .obs-group { margin-top: var(--space-4); }
.obs-note { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; padding-bottom: 4px; border-bottom: 1px solid #3a3a3a; }
.obs-note h3 { font-size: 17px; font-weight: 700; color: var(--dark-text); }
.obs-note .obs-path { font-size: 12.5px; color: var(--dark-muted); }
.obs-task { display: grid; grid-template-columns: 18px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 6px 8px; border-radius: 8px; }
.obs-checkbox { width: 16px; height: 16px; border: 2px solid var(--dark-muted); border-radius: 4px; }
.obs-text { color: var(--dark-text); }
.obs-fields { display: flex; gap: 6px; }
.obs-select { color-scheme: dark; height: 28px; padding: 0 4px; font-size: 13px; cursor: pointer; max-width: 120px; background: #2a2a2a; border: 1.5px solid #4a4a4a; border-radius: 6px; color: var(--dark-text); }
.obs-select:hover { border-color: var(--obsidian-accent); }
.obs-select.is-tag { color: var(--obsidian-accent); }

/* Retro */
.retro-items { display: flex; flex-direction: column; gap: var(--space-3); }
.retro-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 4px; }
.retro-head h3 { font-size: 16px; font-weight: 700; }
.retro-cost { font-size: 13px; color: var(--ink-muted); }
.retro-evidence { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: var(--space-3); align-items: start; }
.term-lines { font: 13px/1.45 var(--font-mono); display: flex; flex-direction: column; gap: 3px; }
.term-line { display: grid; grid-template-columns: 16px minmax(0, 1fr); gap: 6px; overflow-wrap: anywhere; }
.term-tool .term-mark { color: #7ee2a8; }
.term-assistant .term-mark { color: var(--dark-muted); }
.term-error { color: var(--terminal-warning); padding: 3px 6px 3px 2px; margin-left: -2px; border-radius: 6px; background: color-mix(in srgb, var(--fail) 24%, var(--terminal)); }
.term-error .term-mark { display: grid; place-items: center; padding-top: 2px; }
.diff-card { background: var(--paper); border: 2px solid var(--ink); border-radius: 10px; box-shadow: var(--shadow-compact); }
.diff-file { display: flex; align-items: center; gap: 6px; padding: 6px 10px; font-size: 12.5px; border-bottom: 2px solid var(--ink); background: var(--github-board); border-radius: 8px 8px 0 0; }
.diff { margin: 0; padding: 6px 0; font: 13px/1.5 var(--font-mono); white-space: pre-wrap; overflow-wrap: anywhere; }
.diff span { display: block; padding: 0 10px; }
.diff .plus { background: var(--fill-ready); }
.diff .minus { background: var(--fill-failing); }
.sessions { margin-top: var(--space-4); padding: var(--space-3) var(--space-4); }
.sessions h3 { font-size: 16px; font-weight: 700; margin-bottom: 4px; }
.session-row { display: grid; grid-template-columns: auto 240px minmax(0, 1fr); gap: 12px; align-items: center; padding: 4px 8px; border-radius: 8px; }
.session-row.is-approved { background: var(--fill-ready); }
.session-harness { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; }
.session-prompt { font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink-muted); }
.session-row.is-approved .session-prompt { color: var(--ink); }
.sessions-foot { display: flex; align-items: center; justify-content: flex-end; gap: var(--space-4); margin-top: var(--space-2); }

/* Instructions */
.changes { display: flex; flex-direction: column; gap: var(--space-2); }
.change { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 12px; align-items: center; padding: 9px 10px 9px 14px; border: 2px solid var(--ink); border-radius: 10px; }
.verdict-final { background: var(--fill-ready); }
.verdict-watch { background: var(--fill-progress); }
.verdict-attention { background: var(--fill-failing); }
.change-top { display: flex; align-items: baseline; gap: 10px; }
.change-scope { font-size: 13px; font-weight: 600; }
.verdict-word { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; }
.change-summary { font-weight: 600; }
.change-opinion { font-size: 14px; color: var(--ink-muted); }
.change-state { display: flex; gap: 4px; }
.state-chip { display: inline-flex; align-items: center; gap: 3px; padding: 2px 7px 2px 5px; border-radius: var(--radius-badge); font-size: 12.5px; font-weight: 600; border: 2px solid var(--ink); background: var(--paper); }

/* News */
.news-list { padding: var(--space-2); }
.news-item { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto auto; gap: 12px; align-items: center; padding: 10px 10px 10px 12px; border-radius: 10px; }
.news-item + .news-item { margin-top: 2px; }
.news-meta { display: flex; gap: 10px; font-size: 13px; color: var(--ink-muted); }
.news-title { font-weight: 700; font-size: 16px; }
.news-summary { font-size: 14px; }
.vote { display: flex; gap: 4px; }
.vote .icon-button[aria-pressed="true"] { border-color: var(--ink); box-shadow: var(--shadow-compact); }
.vote .vote-up[aria-pressed="true"] { background: var(--fill-ready); }
.vote .vote-down[aria-pressed="true"] { background: var(--fill-failing); }

/* Action points */
.todo { padding: var(--space-3) var(--space-4) var(--space-4); }
.todo-list { display: flex; flex-direction: column; }
.todo-item { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto auto; gap: 12px; align-items: center; padding: 9px 8px; border-radius: 10px; }

.todo-item.is-done .todo-text { text-decoration: line-through; color: var(--ink-muted); }
.check-box { position: relative; display: inline-grid; place-items: center; width: 24px; height: 24px; }
.check-box input { position: absolute; inset: 0; margin: 0; opacity: 0; cursor: pointer; }
.check-box span { display: grid; place-items: center; width: 24px; height: 24px; border: var(--border-width) solid var(--ink); border-radius: 6px; background: var(--paper); color: transparent; pointer-events: none; }
.check-box input:checked + span { background: var(--fill-ready); color: var(--ink); }
.check-box input:focus-visible + span { outline: 3px dashed var(--ink); outline-offset: 3px; }

.handoff button { display: inline-flex; align-items: center; gap: 5px; height: 28px; padding: 0 10px; font-size: 13.5px; font-weight: 600; border: 2px solid transparent; border-radius: 7px; background: none; color: var(--ink-muted); }

.handoff button[data-value="agent"][aria-pressed="true"] { background: var(--sticky-soft); }
.save-row { display: flex; align-items: center; justify-content: flex-end; gap: var(--space-4); margin-top: var(--space-4); padding-top: var(--space-3); border-top: var(--border-width) solid var(--ink); }
.choice-summary { font-size: 13px; color: var(--ink-muted); }

.quiet-slide { display: flex; align-items: center; gap: var(--space-4); padding: var(--space-6); }
.quiet-slide svg { color: var(--done-ink); }

@media (max-width: 1024px) {

	.main { padding: 12px 16px 14px; }
	.variant-tag-long { display: none; }
	.variant-tag-short { display: inline; }
	.gcal { grid-template-columns: auto 210px; }

}
@media (max-width: 760px) {

	.outline-date { margin: 0; padding: 0 8px; border-bottom: 0; border-right: 2px dashed var(--line); }

	.main { display: block; padding: 8px 10px 0; }
	.variant-tag { position: static; display: inline-block; margin-bottom: 4px; }
	.column, .caption-row { width: 100%; }
	.stage { overflow: visible; }
	.transport { position: sticky; bottom: 8px; flex-wrap: wrap; gap: 8px; }
	.progress { order: 5; flex-basis: 100%; }
	.overview, .gcal { grid-template-columns: minmax(0, 1fr); }
	.date-note { transform: none; }
	.gcal-main { --gutter: 48px; --day: minmax(120px, 1fr); }
	.gmail-row { grid-template-columns: minmax(0, 1fr) auto; }
	.gmail-row .gmail-from { grid-column: 1; }
	.gmail-row .account-chip { justify-self: start; }
	.obs-task { grid-template-columns: 18px minmax(0, 1fr); }
	.obs-fields { grid-column: 2; flex-wrap: wrap; }
	.session-row { grid-template-columns: auto minmax(0, 1fr); }
	.session-prompt { grid-column: 1 / -1; white-space: normal; }
	.change, .news-item, .todo-item { grid-template-columns: minmax(0, 1fr) auto; }
	.news-source, .todo-item .check-box { display: none; }
	.run { grid-template-columns: 28px minmax(0, 1fr) auto; }
	.run .brand-mark, .run-duration { display: none; }
}
@media (prefers-reduced-motion: reduce) {
	*, *::before, *::after { transition: none !important; scroll-behavior: auto !important; }
}

const ui = (name, size = 18) => `<svg class="ui-icon" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">${UI_PATHS[name]}</svg>`;

function iconLink(url, label, icon, className = '') {
	const href = safeUrl(url);
	if (!href) return `<span class="icon-link ${className}" role="img" aria-label="${escapeHtml(label)}" title="${escapeHtml(label)}">${icon}</span>`;
	return `<a class="icon-link ${className}" href="${escapeHtml(href)}" target="_blank" rel="noopener" aria-label="${escapeHtml(label)}" title="${escapeHtml(label)}">${icon}</a>`;
}
function gotoButton(chapterId) {
	const chapter = chapters.find((candidate) => candidate.id === chapterId);
	if (!chapter) return '';
	const label = `Go to ${chapter.name}`;
	return `<button class="icon-button" type="button" data-goto="${escapeHtml(chapterId)}" data-key="goto-${escapeHtml(chapterId)}" aria-label="${escapeHtml(label)}" title="${escapeHtml(label)}">${ui('arrowRight')}</button>`;
}
function nativeWindow({ app, theme, title, context = '', actions = '', body, iconColor, label }) {
	return `<section class="window theme-${theme}" aria-label="${escapeHtml(label ?? title)}">
		<header class="window-bar">${brand(app, 17, iconColor)}<span>${escapeHtml(title)}</span>${context ? `<span class="window-context">${escapeHtml(context)}</span>` : ''}<span class="window-actions">${actions}</span></header>
		<div class="window-body">${body}</div>
	</section>`;
}
const AVATAR_COLORS = ['#1264a3', '#0b6e4f', '#9b2c64', '#5b3e96', '#8a4b08', '#2c5d7c'];
const avatarColor = (name) => AVATAR_COLORS[[...String(name)].reduce((sum, character) => sum + character.charCodeAt(0), 0) % AVATAR_COLORS.length];
const initials = (name) => String(name).split(/\s+/).filter(Boolean).slice(0, 2).map((part) => part[0].toUpperCase()).join('');

/* Choices are collected in memory and saved as one file for the apply session. */
const chapterOf = (type) => chapters.find((chapter) => chapter.type === type);
const choices = { news: {}, triage: {}, retro: { approved: [], confirmed: false }, actions: {}, autoHandled: {} };
for (const group of chapterOf('triage')?.data.groups ?? []) for (const item of group.items) choices.triage[item.id] = { project: item.project ?? '', heading: item.heading ?? '', priority: item.priority ?? '' };
for (const item of chapterOf('actions')?.data.items ?? []) choices.actions[item.id] = { handoff: item.handoff ?? 'you', done: false };
for (const item of chapterOf('work')?.data.autoHandled ?? []) choices.autoHandled[item.id] = true;
function exportedChoices() {
	const triageGroups = chapterOf('triage')?.data.groups ?? [];
	const retroItems = chapterOf('retro')?.data.items ?? [];
	return {
		date: brief.date,
		exported: new Date().toISOString(),
		news: (chapterOf('news')?.data.items ?? []).filter((item) => choices.news[item.id]).map((item) => ({ id: item.id, title: item.title, url: item.url, vote: choices.news[item.id] })),
		triage: triageGroups.flatMap((group) => group.items.map((item) => ({ id: item.id, note: group.note, text: item.text, ...choices.triage[item.id] }))),
		retro: { confirmed: choices.retro.confirmed, sessions: retroItems.filter((item) => choices.retro.approved.includes(item.id)).map((item) => ({ id: item.id, title: item.title, fix: item.fix, ...item.session })) },
		actions: (chapterOf('actions')?.data.items ?? []).map((item) => ({ id: item.id, text: item.text, ...choices.actions[item.id] })),
		autoHandled: (chapterOf('work')?.data.autoHandled ?? []).map((item) => ({ id: item.id, text: item.text, proposal: item.proposal, approved: choices.autoHandled[item.id] })),
	};
}
function choiceSummary() {
	const exported = exportedChoices();
	const agentCount = exported.actions.filter((item) => item.handoff === 'agent').length;
	const plural = (count, word) => `${count} ${word}${count === 1 ? '' : 's'}`;
	return [plural(exported.news.length, 'news vote'), plural(exported.triage.length, 'triage item'), plural(exported.retro.sessions.length, 'fix session'), `${agentCount} for the agent`].join(' · ');
}
function downloadChoices() {
	const blob = new Blob([JSON.stringify(exportedChoices(), null, 2)], { type: 'application/json' });
	const anchor = document.createElement('a');
	anchor.href = URL.createObjectURL(blob);
	anchor.download = 'choices.json';
	document.body.append(anchor);
	anchor.click();
	anchor.remove();
	setTimeout(() => URL.revokeObjectURL(anchor.href), 1000);
}

/* Chapter renderers, keyed by chapter type. */
const RENDERERS = {
	overview(data) {
		return `<div class="overview">
			<div class="date-note">
				<span class="date-weekday">${escapeHtml(data.weekday)}</span>
				<span class="date-day">${escapeHtml(data.dayLabel)}</span>
				<span class="date-window mono">${escapeHtml(brief.window.label)}</span>
			</div>
			<ol class="needs">${(data.needs ?? []).map((need) => `
				<li class="need" ${targetAttribute(need.id)}>
					${brand(need.app, 24)}
					<span class="need-text"><strong>${escapeHtml(need.text)}</strong><span class="muted">${escapeHtml(need.detail)}</span></span>
					<span class="row-actions">${iconLink(need.url, `Open in ${brandLabel(need.app)}`, ui('external'))}${gotoButton(need.chapter)}</span>
				</li>`).join('')}</ol>
		</div>`;
	},

	calendar(data, chapter) {
		const HOUR = 33;
		const calendars = new Map(data.calendars.map((calendar) => [calendar.id, calendar]));
		const days = data.days;
		const focusDay = days.find((day) => day.focus) ?? days[0];
		const timed = data.events.filter((event) => !event.allDay && event.start && event.end);
		const nowMinutes = brief.now.slice(0, 10) === brief.date ? toMinutes(brief.now.slice(11, 16)) : undefined;
		const firstHour = Math.max(0, Math.min(...timed.map((event) => Math.floor(toMinutes(event.start) / 60)), ...(nowMinutes === undefined ? [] : [Math.floor(nowMinutes / 60)])) - 1);
		const lastHour = Math.min(24, Math.max(...timed.map((event) => Math.ceil(toMinutes(event.end) / 60))));
		const height = (lastHour - firstHour) * HOUR;
		const colorOf = (event) => calendars.get(event.calendarId)?.color ?? 'var(--google-calendar)';
		const titleOf = (event) => event.busyOnly ? 'Busy' : event.title;
		const dayOf = (event) => days.find((day) => day.id === event.day);

		const eventBlock = (event) => {
			const duration = toMinutes(event.end) - toMinutes(event.start);
			const top = ((toMinutes(event.start) / 60) - firstHour) * HOUR;
			const blockHeight = Math.max(22, (duration / 60) * HOUR - 2);
			const short = duration <= 60;
			const calendar = calendars.get(event.calendarId);
			const label = `${titleOf(event)}, ${event.start} to ${event.end}, ${calendar?.name ?? ''} calendar`;
			return `<button type="button" class="gcal-event ${short ? 'is-short' : ''} ${chapter.selected === event.id ? 'is-selected' : ''}" ${targetAttribute(`event-${event.id}`)}
				data-event="${escapeHtml(event.id)}" data-key="event-${escapeHtml(event.id)}" aria-pressed="${chapter.selected === event.id}" aria-label="${escapeHtml(label)}"
				style="--event:${escapeHtml(colorOf(event))};top:${top}px;height:${blockHeight}px">
				<span class="event-title">${escapeHtml(titleOf(event))}${short ? ',' : ''}</span><span class="event-time mono">${short ? escapeHtml(event.start) : `${escapeHtml(event.start)}–${escapeHtml(event.end)}`}</span>
			</button>`;
		};
		const hours = [];
		for (let hour = firstHour + 1; hour < lastHour; hour++) hours.push(`<span class="gcal-hour mono" style="top:${(hour - firstHour) * HOUR}px">${String(hour).padStart(2, '0')}:00</span>`);

		const selected = data.events.find((event) => event.id === chapter.selected);
		const selectedCalendar = selected && calendars.get(selected.calendarId);
		const selectedDay = selected && dayOf(selected);
		const detail = selected ? `
			<div class="gcal-detail" ${targetAttribute('event-detail')} role="region" aria-label="Event details" style="--event:${escapeHtml(colorOf(selected))}">
				<div class="gcal-detail-head"><span class="swatch"></span><h3>${escapeHtml(titleOf(selected))}</h3>
					${iconLink(selected.url, 'Open in Google Calendar', ui('external'))}
					<button class="icon-button" type="button" data-close-detail data-key="close-detail" aria-label="Close event details" title="Close event details">${ui('x', 16)}</button>
				</div>
				<p class="gcal-fact">${ui('clock', 16)}<span>${escapeHtml(selectedDay ? `${selectedDay.label} ${selectedDay.date} ${monthName}` : '')}${selected.allDay ? ', all day' : `, <span class="mono">${escapeHtml(selected.start)}–${escapeHtml(selected.end)}</span>`}</span></p>
				${selected.place ? `<p class="gcal-fact">${ui('pin', 16)}<span>${escapeHtml(selected.place)}</span></p>` : ''}
				${(selected.notes ?? []).map((note) => `<p class="gcal-fact gcal-note">${ui('clock', 16)}<span>${escapeHtml(note)}</span></p>`).join('')}
				<p class="gcal-fact muted"><span class="swatch" style="margin-top:0"></span>${escapeHtml(selectedCalendar?.name ?? '')}</p>
			</div>` : '';
		const legend = `<div class="gcal-legend"><span class="gcal-legend-title">My calendars</span><ul class="gcal-legend">${data.calendars.map((calendar) => `
			<li><span class="swatch" style="--event:${escapeHtml(calendar.color)}"></span>${escapeHtml(calendar.name)}${calendar.busyOnly ? ' <span class="muted">(busy only)</span>' : ''}</li>`).join('')}</ul></div>`;

		const body = `<div class="gcal">
			<div class="gcal-main" style="--days:${days.length};--hour:${HOUR}px">
				<div class="gcal-row">
					<span class="gcal-zone mono">GMT+02</span>
					${days.map((day) => `<div class="gcal-dayhead ${day.id === focusDay.id ? 'is-focus' : ''}"><span class="gcal-weekday">${escapeHtml(day.label)}</span><span class="gcal-date">${escapeHtml(day.date)}</span></div>`).join('')}

	work(data, chapter) {
		const scopes = [...new Set(data.projects.map((project) => project.scope))];

		const projects = data.projects.filter((project) => project.scope === chapter.scope);
		const appOf = (scope) => data.projects.find((project) => project.scope === scope)?.app ?? 'gitlab';
		const app = appOf(chapter.scope);
		const openCount = (scope) => data.projects.filter((project) => project.scope === scope).flatMap((project) => project.cards).filter((card) => card.state !== 'merged').length;
		const tabs = `<div class="scope-tabs" role="group" aria-label="Scope">${scopes.map((scope) => `
			<button type="button" class="scope-tab" data-scope="${escapeHtml(scope)}" data-key="scope-${escapeHtml(scope)}" aria-pressed="${scope === chapter.scope}" title="${escapeHtml(`${capitalize(scope)} projects`)}">
				${brand(appOf(scope), 15)}${escapeHtml(capitalize(scope))}<span class="scope-count mono">${openCount(scope)}</span></button>`).join('')}</div>`;
		const isGithub = app === 'github';
		const pipelineIcon = { success: 'pipelineSuccess', failed: 'pipelineFailed', running: 'pipelineRunning' };
		const card = (item, project) => {
			const links = [];
			if (item.state !== 'merged' || item.url) links.push(iconLink(item.url, `Open ${item.ref} ${project.app === 'github' ? 'pull request' : 'merge request'}`, ui('merge')));
			if (item.pipeline) links.push(iconLink(item.pipeline.url, `Pipeline ${item.pipeline.status}${item.pipeline.job ? ` in ${item.pipeline.job}` : ''}`, ui(pipelineIcon[item.pipeline.status] ?? 'pipelineRunning'), `pipeline-${escapeHtml(item.pipeline.status)}`));
			if (item.ticket) {
				const wrong = item.ticket.expected && item.ticket.expected !== item.ticket.column;
				const label = `KanbanFlow ${item.ticket.ref} is in ${item.ticket.column}${wrong ? `, should be ${item.ticket.expected}` : ''}`;
				const href = safeUrl(item.ticket.url);
				links.push(`<a class="ticket-chip ${wrong ? 'is-wrong' : ''}" ${href ? `href="${escapeHtml(href)}" target="_blank" rel="noopener"` : ''} aria-label="${escapeHtml(label)}" title="${escapeHtml(label)}">${ui('ticket', 16)}<span class="mono">${escapeHtml(item.ticket.ref)}</span>${wrong ? ui('warning', 14) : ''}</a>`);
			}
			if (item.session) links.push(iconLink(item.session.url, `Open live session in ${item.session.label}`, ui('session')));
			if (item.local) {
				const label = `${item.local.uncommitted} uncommitted files, ${item.local.unpushed} unpushed commit${item.local.unpushed === 1 ? '' : 's'}`;
				links.push(`<span class="local-chip" role="img" aria-label="${escapeHtml(label)}" title="${escapeHtml(label)}">${ui('fileDiff', 15)}<span class="mono">${escapeHtml(item.local.uncommitted)}</span>${ui('arrowUp', 15)}<span class="mono">${escapeHtml(item.local.unpushed)}</span></span>`);

				<p class="mr-title">${escapeHtml(item.title)}</p>
				<div class="mr-links">${links.join('')}</div>
			</article>`;
		};
		const repos = projects.map((project) => `<section class="repo" aria-label="${escapeHtml(project.name)}">
			<header class="repo-head">${brand(project.app, 16)}<span class="mono">${escapeHtml(project.name)}</span>${iconLink(project.url, `Open ${project.name} on ${brandLabel(project.app)}`, ui('external', 16))}</header>

/* Player: one timeline for the brief; a beat lasts its estimated speech time, quiet chapters hold briefly. */
const SPEEDS = [1, 1.25, 1.5, 2];
const WORDS_PER_SECOND = 2.6;
const QUIET_HOLD_SECONDS = 2;
const voiceAvailable = 'speechSynthesis' in window;
const state = { chapter: 0, beat: 0, elapsed: 0, playing: false, finished: false, speedIndex: 0, muted: !voiceAvailable, speaking: false };
const speed = () => SPEEDS[state.speedIndex];
const isQuiet = (chapter) => chapter.status === 'quiet';
const beatsOf = (chapter) => chapter.beats?.length ? chapter.beats : [{ say: chapter.title, note: chapter.name, targets: [] }];
const beatSeconds = (chapter, beat) => isQuiet(chapter) ? QUIET_HOLD_SECONDS : beat.say.trim().split(/\s+/).length / (WORDS_PER_SECOND * speed()) + 0.6 / speed();
const chapterSeconds = (chapter) => beatsOf(chapter).reduce((total, beat) => total + beatSeconds(chapter, beat), 0);
const currentChapter = () => chapters[state.chapter];
const currentBeat = () => beatsOf(currentChapter())[state.beat];
const COLUMN_WIDTHS = { calendar: (chapter) => 760 + Math.max(0, chapter.data.days.length - 2) * 180, work: () => 900, retro: () => 980 };
const formatTime = (seconds) => `${Math.floor(seconds / 60)}:${String(Math.floor(seconds % 60)).padStart(2, '0')}`;

const CHAPTER_ICONS = { overview: ['ui', 'sun'], calendar: ['brand', 'googlecalendar'], work: ['brand', 'gitlab'], overnight: ['ui', 'moon'], slack: ['brand', 'slack'], mail: ['brand', 'gmail'], triage: ['brand', 'obsidian'], retro: ['brand', 'terminal'], instructions: ['ui', 'file'], news: ['ui', 'news'], actions: ['ui', 'checklist'] };
function chapterIcon(chapter, size) {
	const [kind, name] = CHAPTER_ICONS[chapter.type] ?? ['ui', 'file'];
	return kind === 'brand' ? brand(name, size) : ui(name, size);
}
const sourceWarnings = (chapter) => (brief.sources ?? []).filter((source) => source.status !== 'ok' && source.chapters?.includes(chapter.id)).map((source) => `${source.name} ${source.status}. ${source.reason ?? ''}`.trim());

function preservingFocus(render) {
	const key = document.activeElement?.dataset?.key;
	render();
	if (key) document.querySelector(`[data-key="${CSS.escape(key)}"]`)?.focus({ preventScroll: true });
}

function renderOutline() {
	preservingFocus(() => {
		byId('chapter-list').innerHTML = chapters.map((chapter, index) => {
			const current = index === state.chapter;
			const warnings = sourceWarnings(chapter);
			const marker = isQuiet(chapter) ? `<span class="marker marker-quiet" title="Quiet">${ui('check', 14)}</span>`
				: chapter.count ? `<span class="marker marker-${escapeHtml(chapter.status)}" title="${escapeHtml(chapter.status === 'needs' ? `${chapter.count} need you` : `${chapter.count} items`)}">${escapeHtml(chapter.count)}</span>` : '';
			const warning = warnings.length ? `<span class="source-warning" role="img" aria-label="${escapeHtml(`Source warning: ${warnings.join(' ')}`)}" title="${escapeHtml(warnings.join('\n'))}">${ui('warning', 15)}</span>` : '';
			const beats = current ? `<ol class="beat-list">${beatsOf(chapter).map((beat, beatIndex) => {
				const status = beatIndex === state.beat ? 'is-current' : beatIndex < state.beat ? 'is-done' : '';
				const icon = beatIndex === state.beat ? ui('play', 12) : beatIndex < state.beat ? ui('check', 12) : ui('dot', 12);
				return `<li><button type="button" class="beat-row ${status}" data-beat="${beatIndex}" data-key="beat-${index}-${beatIndex}" ${beatIndex === state.beat ? 'aria-current="step"' : ''} title="${escapeHtml(beat.say)}">${icon}${escapeHtml(beat.note)}</button></li>`;
			}).join('')}</ol>` : '';
			return `<li class="chapter-item ${current ? 'is-current' : ''} ${isQuiet(chapter) ? 'is-quiet' : ''}">
				<button type="button" class="chapter-row" data-chapter="${index}" data-key="chapter-${index}" ${current ? 'aria-current="true"' : ''} aria-label="${escapeHtml(`${chapter.name}: ${chapter.title}`)}" title="${escapeHtml(`${chapter.name}: ${chapter.title}`)}">
					<span class="chapter-icon">${chapterIcon(chapter, 20)}</span><span class="chapter-name">${escapeHtml(chapter.name)}</span>${warning}${marker}
				</button>${beats}</li>`;
		}).join('');
	});
	document.querySelector('.chapter-item.is-current')?.scrollIntoView({ block: 'nearest' });
}

function renderStage() {
	const chapter = currentChapter();
	const widthFor = COLUMN_WIDTHS[chapter.type];
	byId('main').style.setProperty('--column-width', `${widthFor ? widthFor(chapter) : 760}px`);
	byId('chapter-icon').innerHTML = chapterIcon(chapter, 30);
	byId('kicker').innerHTML = `<span class="mono">${state.chapter + 1}/${chapters.length}</span><span>${escapeHtml(chapter.name)}</span>`;
	byId('chapter-title').textContent = chapter.title;
	preservingFocus(() => { stage.innerHTML = isQuiet(chapter) ? renderQuiet(chapter) : RENDERERS[chapter.type](chapter.data ?? {}, chapter); });
	highlight();
}

function highlight() {
	const beat = currentBeat();
	const names = [...(beat.targets ?? []), ...(beat.select ? ['event-detail'] : [])];
	stage.querySelectorAll('.is-target, .is-path').forEach((element) => element.classList.remove('is-target', 'is-path'));
	let first;
	for (const name of names) stage.querySelectorAll(`[data-target="${CSS.escape(name)}"]`).forEach((element) => {
		element.classList.add('is-target');
		first ??= element;
		// Opacity multiplies down the tree, so containers of a target must never dim.
		for (let ancestor = element.parentElement; ancestor && ancestor !== stage; ancestor = ancestor.parentElement) ancestor.classList.add('is-path');
	});
	stage.classList.toggle('is-highlighting', Boolean(first));
	const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
	first?.scrollIntoView({ block: 'nearest', inline: 'nearest', behavior: reduceMotion ? 'auto' : 'smooth' });
}

function setChapter(index, beatIndex = 0) {
	state.chapter = index;
	state.finished = false;
	stage.scrollTop = 0;
	setBeat(beatIndex, true);
}
function setBeat(index, chapterChanged = false) {
	const chapter = currentChapter();
	state.beat = index;
	state.elapsed = 0;
	const beat = currentBeat();
	const needsRender = chapterChanged || (beat.select && beat.select !== chapter.selected) || (beat.scope && beat.scope !== chapter.scope);
	if (beat.select) chapter.selected = beat.select;
	if (beat.scope) chapter.scope = beat.scope;
	if (needsRender) renderStage(); else highlight();
	byId('caption-text').textContent = beat.say;
	byId('caption-count').textContent = `${index + 1}/${beatsOf(chapter).length}`;
	renderOutline();
	renderTransport();
	speak();
}
function goTo(chapterIndex, beatIndex) {
	state.finished = false;
	if (chapterIndex !== state.chapter) setChapter(chapterIndex, beatIndex); else setBeat(beatIndex);
}
function stepBeat(direction) {
	const next = state.beat + direction;
	if (next >= 0 && next < beatsOf(currentChapter()).length) return goTo(state.chapter, next);
	const nextChapter = state.chapter + direction;
	if (nextChapter < 0 || nextChapter >= chapters.length) return;
	goTo(nextChapter, direction < 0 ? beatsOf(chapters[nextChapter]).length - 1 : 0);
}
function jumpChapter(direction) {
	const nextChapter = Math.min(chapters.length - 1, Math.max(0, state.chapter + direction));
	goTo(nextChapter, 0);
}
function advance() {
	if (state.beat < beatsOf(currentChapter()).length - 1) return setBeat(state.beat + 1);
	if (state.chapter < chapters.length - 1) return setChapter(state.chapter + 1);
	state.playing = false;
	state.finished = true;
	state.elapsed = beatSeconds(currentChapter(), currentBeat());
	renderTransport();
}
function togglePlay() {
	if (state.playing) return pause();
	if (state.finished) setChapter(0);
	state.playing = true;
	speak();
	renderTransport();
}
function pause() {
	if (!state.playing) return;
	state.playing = false;
	stopVoice();
	renderTransport();
}
function stopVoice() {
	if (voiceAvailable) window.speechSynthesis.cancel();
	state.speaking = false;
}
function speak() {
	stopVoice();
	if (state.muted || !state.playing || !voiceAvailable) return;
	const utterance = new SpeechSynthesisUtterance(currentBeat().say);
	utterance.rate = speed();
	const voices = window.speechSynthesis.getVoices().filter((voice) => voice.lang.startsWith('en'));
	utterance.voice = voices.find((voice) => /natural|online/i.test(voice.name)) ?? voices[0] ?? null;
	utterance.onend = utterance.onerror = () => { state.speaking = false; };
	state.speaking = true;
	window.speechSynthesis.speak(utterance);
}

function buildProgress() {
	byId('progress').innerHTML = chapters.map((chapter, index) => {
		const beats = beatsOf(chapter);
		const total = chapterSeconds(chapter);
		let elapsed = 0;
		const ticks = beats.slice(0, -1).map((beat) => { elapsed += beatSeconds(chapter, beat); return `<span class="tick" style="left:${(elapsed / total) * 100}%"></span>`; }).join('');
		return `<button type="button" class="segment ${isQuiet(chapter) ? 'is-quiet' : ''}" data-segment="${index}" style="flex-grow:${total}" aria-label="${escapeHtml(`Play from ${chapter.name}`)}" title="${escapeHtml(chapter.name)}"><span class="segment-fill"></span>${ticks}</button>`;
	}).join('');
}
function paintProgress() {
	const chapter = currentChapter();
	const beats = beatsOf(chapter);
	const beatElapsed = Math.min(state.elapsed, beatSeconds(chapter, currentBeat()));
	const chapterElapsed = beats.slice(0, state.beat).reduce((total, beat) => total + beatSeconds(chapter, beat), 0) + beatElapsed;
	const chapterTotal = chapterSeconds(chapter);
	byId('progress').querySelectorAll('.segment').forEach((element, index) => {
		element.classList.toggle('is-current', index === state.chapter);
		element.firstElementChild.style.transform = `scaleX(${index < state.chapter ? 1 : index === state.chapter ? chapterElapsed / chapterTotal : 0})`;
	});
	const before = chapters.slice(0, state.chapter).reduce((total, candidate) => total + chapterSeconds(candidate), 0);
	const total = chapters.reduce((sum, candidate) => sum + chapterSeconds(candidate), 0);
	byId('time').textContent = `${formatTime(before + chapterElapsed)} / ${formatTime(total)}`;
}
function setIconButton(id, icon, label, extra = '') {
	const button = byId(id);
	button.innerHTML = icon + extra;
	button.setAttribute('aria-label', label);
	button.title = label;
}
function renderTransport() {
	const atStart = state.chapter === 0 && state.beat === 0;
	const atEnd = state.chapter === chapters.length - 1 && state.beat === beatsOf(currentChapter()).length - 1;
	setIconButton('chapter-previous', ui('chapterPrevious', 20), 'Previous chapter (Shift+Left)');
	setIconButton('beat-previous', ui('beatPrevious', 20), 'Previous point (Left)');
	setIconButton('beat-next', ui('beatNext', 20), 'Next point (Right)');
	setIconButton('chapter-next', ui('chapterNext', 20), 'Next chapter (Shift+Right)');
	setIconButton('play', ui(state.playing ? 'pause' : 'play', 22), state.playing ? 'Pause brief (Space)' : state.finished ? 'Replay brief (Space)' : 'Play brief (Space)');
	byId('chapter-previous').disabled = state.chapter === 0;
	byId('beat-previous').disabled = atStart;
	byId('beat-next').disabled = atEnd;
	byId('chapter-next').disabled = state.chapter === chapters.length - 1;
	setIconButton('speed', ui('speed', 18), `Speed ${speed()}×, change speed`, `<span class="speed-value">${speed()}×</span>`);
	setIconButton('mute', ui(state.muted ? 'volumeMute' : 'volume', 20), !voiceAvailable ? 'Voice not available in this browser' : state.muted ? 'Unmute voice' : 'Mute voice');
	byId('mute').disabled = !voiceAvailable;
	byId('mute').setAttribute('aria-pressed', String(state.muted));
}

let lastFrame = 0;
function frame(now) {
	const delta = lastFrame ? Math.min(0.25, (now - lastFrame) / 1000) : 0;
	lastFrame = now;
	if (state.playing) {
		const duration = beatSeconds(currentChapter(), currentBeat());
		state.elapsed += delta;
		// The browser voice can run longer than the estimate; wait for it, but never indefinitely.
		if (state.elapsed >= duration && !(state.speaking && state.elapsed < duration * 2.5)) advance();
	}
	paintProgress();
	requestAnimationFrame(frame);
}

/* Shell controls keep playback running; acting on the content pauses it. */
byId('play').addEventListener('click', togglePlay);
byId('beat-previous').addEventListener('click', () => stepBeat(-1));
byId('beat-next').addEventListener('click', () => stepBeat(1));
byId('chapter-previous').addEventListener('click', () => jumpChapter(-1));
byId('chapter-next').addEventListener('click', () => jumpChapter(1));
byId('speed').addEventListener('click', () => {
	state.speedIndex = (state.speedIndex + 1) % SPEEDS.length;
	buildProgress();
	renderTransport();
	speak();
});
byId('mute').addEventListener('click', () => { state.muted = !state.muted; renderTransport(); speak(); });
byId('progress').addEventListener('click', (event) => {
	const segment = event.target.closest('[data-segment]');
	if (!segment) return;
	const chapterIndex = Number(segment.dataset.segment);
	const chapter = chapters[chapterIndex];
	const rect = segment.getBoundingClientRect();
	const fraction = event.detail === 0 ? 0 : Math.min(1, Math.max(0, (event.clientX - rect.left) / rect.width));
	const position = fraction * chapterSeconds(chapter);
	let elapsed = 0;
	let beatIndex = 0;
	beatsOf(chapter).forEach((beat, index) => { if (elapsed <= position) beatIndex = index; elapsed += beatSeconds(chapter, beat); });
	goTo(chapterIndex, beatIndex);
});
byId('chapter-list').addEventListener('click', (event) => {
	const beatButton = event.target.closest('[data-beat]');
	if (beatButton) return goTo(state.chapter, Number(beatButton.dataset.beat));
	const chapterButton = event.target.closest('[data-chapter]');
	if (chapterButton) goTo(Number(chapterButton.dataset.chapter), 0);
});

stage.addEventListener('click', (event) => {
	const control = event.target.closest('a, button, input, select, label, summary');
	if (!control) return;
	pause();
	const chapter = currentChapter();
	const data = control.dataset;
	if ('goto' in data) {
		const index = chapters.findIndex((candidate) => candidate.id === data.goto);
		if (index >= 0) goTo(index, 0);
		return;
	}
	if ('event' in data) { chapter.selected = data.event; return renderStage(); }
	if ('closeDetail' in data) { chapter.selected = null; return renderStage(); }
	if ('scope' in data) { chapter.scope = data.scope; return renderStage(); }
	if ('news' in data) { choices.news[data.news] = choices.news[data.news] === data.vote ? undefined : data.vote; return renderStage(); }
	if ('retro' in data) {
		const approved = new Set(choices.retro.approved);
		if (approved.has(data.retro)) approved.delete(data.retro); else approved.add(data.retro);
		choices.retro = { approved: [...approved], confirmed: false };
		return renderStage();
	}
	if ('confirmRetro' in data) { choices.retro.confirmed = true; return renderStage(); }
	if ('auto' in data) { choices.autoHandled[data.auto] = !choices.autoHandled[data.auto]; return renderStage(); }
	if ('handoff' in data) { choices.actions[data.handoff].handoff = data.value; chapter.saved = false; return renderStage(); }
	if ('save' in data) {
		downloadChoices();
		chapter.saved = true;
		renderStage();
		setTimeout(() => { chapter.saved = false; if (currentChapter() === chapter) renderStage(); }, 2500);
	}
});
stage.addEventListener('change', (event) => {
	const field = event.target;
	if (field.dataset.triage) choices.triage[field.dataset.triage][field.dataset.field] = field.value;
	if (field.dataset.done) {
		choices.actions[field.dataset.done].done = field.checked;
		field.closest('.todo-item')?.classList.toggle('is-done', field.checked);
		const summary = byId('choice-summary');
		if (summary) summary.textContent = choiceSummary();
	}
});
stage.addEventListener('toggle', (event) => {
	if (event.target.matches?.('.slack-disclosure')) currentChapter().slackOpen = event.target.open;
}, true);
document.addEventListener('keydown', (event) => {
	if (event.target.closest?.('input, select, textarea') || event.altKey || event.ctrlKey || event.metaKey) return;
	if (event.key === ' ') {
		if (event.target.closest?.('button, a, summary')) return;
		event.preventDefault();
		togglePlay();
	} else if (event.key === 'ArrowRight' || event.key === 'ArrowLeft') {
		event.preventDefault();
		const direction = event.key === 'ArrowRight' ? 1 : -1;
		if (event.shiftKey) jumpChapter(direction); else stepBeat(direction);
	}
});

const overview = chapterOf('overview')?.data;
byId('outline-weekday').textContent = overview?.weekday ?? brief.date;
byId('outline-weekday-short').textContent = `${(overview?.weekday ?? '').slice(0, 3)} ${brief.date.slice(8, 10)}`;
byId('outline-day').textContent = overview?.dayLabel ?? '';
byId('outline-window').textContent = brief.window.label;
document.title = `Morning brief, ${overview?.weekday ?? ''} ${overview?.dayLabel ?? brief.date}`;
buildProgress();
setChapter(0);
requestAnimationFrame(frame);
</script>
</body>
</html>
